<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>

<script>
window.EGD=(function(){
  var cfg,KEY;
  function parseCSV(text){
    text=String(text).replace(/^﻿/,'');
    var rows=[],row=[],f='',q=false,i,c;
    for(i=0;i<text.length;i++){c=text[i];
      if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
      else if(c==='"')q=true;
      else if(c===','){row.push(f);f='';}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
      else f+=c;
    }
    if(f!==''||row.length){row.push(f);rows.push(row);}
    rows=rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
    if(rows.length<2)throw new Error('Need a header row and at least one data row.');
    var head=rows[0].map(function(h){return String(h).trim().toLowerCase().replace(/\s+/g,'_');});
    var miss=cfg.required.filter(function(c){return head.indexOf(c)<0;});
    if(miss.length)throw new Error('Missing column(s): '+miss.join(', '));
    return rows.slice(1).map(function(r){var o={};head.forEach(function(h,j){o[h]=(r[j]==null?'':String(r[j]).trim());});return o;});
  }
  function load(text,isSample){return cfg.build(parseCSV(text),isSample);}
  function el(tag,attrs,html){var e=document.createElement(tag);for(var k in (attrs||{}))e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e;}
  function mount(isSample){
    var banner=el('div',{'class':'egd-banner'});
    banner.appendChild(el('span',{},isSample?'Sample data — load your own to see your team.':'Showing your data (kept only in this browser).'));
    var open=el('button',{'class':'egd-btn pri',type:'button'},'Load your own data');
    banner.appendChild(open);
    var ov=el('div',{'class':'egd-ov',hidden:''});
    var panel=el('div',{'class':'egd-panel',role:'dialog','aria-label':'Load your own data'});
    panel.innerHTML='<h3>Load your own data</h3><p>Upload a CSV file or paste CSV text. It is read only in your browser and saved in this browser’s local storage. Nothing is sent anywhere.</p><p><b>Expected columns</b> (first row = header):</p><code></code><p>'+cfg.help+'</p>';
    panel.querySelector('code').textContent=cfg.columns.join(',');
    var file=el('input',{type:'file',accept:'.csv,text/csv,text/plain'});
    var ta=el('textarea',{placeholder:'Or paste CSV text here',spellcheck:'false'});
    var err=el('div',{'class':'egd-err'});
    var row=el('div',{'class':'egd-row'});
    var go=el('button',{'class':'egd-btn pri',type:'button'},'Load data');
    var tpl=el('a',{'class':'egd-btn',href:'#',download:cfg.filename},'Download CSV template');
    var rst=el('button',{'class':'egd-btn',type:'button'},'Reset to sample');
    var cl=el('button',{'class':'egd-btn',type:'button'},'Close');
    [go,tpl,rst,cl].forEach(function(b){row.appendChild(b);});
    [file,ta,err,row].forEach(function(n){panel.appendChild(n);});
    ov.appendChild(panel);
    try{tpl.href=URL.createObjectURL(new Blob([cfg.sample],{type:'text/csv'}));}catch(e){tpl.href='data:text/csv;charset=utf-8,'+encodeURIComponent(cfg.sample);}
    function reset(){try{localStorage.removeItem(KEY);}catch(e){}try{if(window.EvergreenSetup&&cfg.setup)EvergreenSetup.reset(cfg.setup);}catch(e){}location.reload();}
    open.onclick=function(){err.textContent='';ov.hidden=false;};
    cl.onclick=function(){ov.hidden=true;};
    ov.addEventListener('click',function(e){if(e.target===ov)ov.hidden=true;});
    rst.onclick=reset;
    function apply(){
      var text=ta.value;err.textContent='';
      try{load(text,false);}catch(e){err.textContent='Could not read that data: '+e.message;return;}
      try{localStorage.setItem(KEY,text);}catch(e){err.textContent='Your browser blocked local storage, so the data cannot be saved.';return;}
      location.reload();
    }
    go.onclick=apply;
    file.onchange=function(){var f=file.files&&file.files[0];if(!f)return;var r=new FileReader();r.onload=function(){ta.value=String(r.result);apply();};r.readAsText(f);};
    if(!isSample){var b2=el('button',{'class':'egd-btn',type:'button'},'Reset to sample');b2.onclick=reset;banner.appendChild(b2);}
    document.body.insertBefore(banner,document.body.firstChild);
    document.body.appendChild(ov);
  }
  return {init:function(c){
    cfg=c;KEY=c.key;var saved=null,D=null,isSample=true;
    try{saved=localStorage.getItem(KEY);}catch(e){}
    if(saved){try{D=load(saved,false);isSample=false;}catch(e){D=null;}}
    if(!D)D=load(c.sample,true);
    mount(isSample);
    return D;
  }};
})();
</script>

<script>
const SETUP_ID='business-gifts';
const ANS=(function(){try{return (window.EvergreenSetup&&EvergreenSetup.answers(SETUP_ID))||{};}catch(e){return {};}})();
const ANS_USED=JSON.stringify(ANS);
const has=v=>v!==''&&v!=null&&isFinite(Number(v));
const nk=s=>{const p=String(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').trim().split(/\s+/).filter(Boolean);return p.length?p[0]+(p[1]?' '+p[1][0]:''):'';};
const REP=['CSP','Rep','Manager'].indexOf(ANS.repWord)>=0?ANS.repWord:'CSP', REPS=REP+'s';
const escH=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function buildGifts(rows, forDesign, isSample){
  const MO=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[$,\s]/g,''));return isFinite(n)?n:0;};
  const opt=v=>{if(v==null||String(v).trim()==='')return null;const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)?n:null;};
  const GOALS=(Array.isArray(ANS.reps)?ANS.reps:[]).map(r=>({k:nk(r.name),name:String(r.name||'').trim(),biz:opt(r.biz),rlt:opt(r.rlt)})).filter(g=>g.k);
  const recs=rows.map(r=>({type:/^r/i.test(r.type||'')?'RLT':'BIZ',name:(r.name||'').trim(),year:parseInt(r.year,10),m:MO.map(k=>num(r[k])),orders:num(r.orders),goal:opt(r.goal),proj:opt(r.projection)})).filter(x=>x.name&&x.year>1900);
  if(!recs.length)throw new Error('No usable rows (each row needs a name and a year).');
  const Y=Math.max(...recs.map(x=>x.year)), years=[Y-2,Y-1,Y];
  const now=new Date(), pad=n=>String(n).padStart(2,'0');
  const asof=isSample?'2026-11-03':(now.getFullYear()===Y?`${Y}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`:`${Y}-12-31`);
  const ad=new Date(asof+'T12:00:00'), cm=ad.getMonth(), frac=ad.getDate()/new Date(Y,cm+1,0).getDate();
  const sum=a=>a.reduce((x,z)=>x+z,0);
  const zero=()=>Array(12).fill(0);
  const toDate=a=>Math.round(sum(a.slice(0,cm))+a[cm]*frac);
  const labels={BIZ:'Business gifts',RLT:'Realtor gifts'};
  const types={};
  ['BIZ','RLT'].forEach(T=>{
    const byName={};
    recs.filter(x=>x.type===T).forEach(x=>{
      const o=byName[x.name]||(byName[x.name]={name:x.name,y:{},orders:0,goal:null,proj:null});
      const cur=o.y[x.year]||(o.y[x.year]=zero());
      x.m.forEach((v,i)=>{cur[i]+=v;});
      if(x.year===Y)o.orders+=x.orders;
      if(x.goal!=null)o.goal=x.goal;
      if(x.proj!=null)o.proj=x.proj;
    });
    const monthly={};years.forEach(y=>{monthly[y]=zero();});
    const reps=Object.values(byName).map(o=>{
      const yrs={};
      years.forEach(y=>{const a=o.y[y]||zero();yrs[y]=sum(a);a.forEach((v,i)=>{monthly[y][i]+=v;});});
      const cur=o.y[Y]||zero(), ly=o.y[Y-1]||zero(), ytd=sum(cur);
      const r={name:o.name,years:yrs,ytd:ytd,ly_ytd:toDate(ly),orders:o.orders,avg:o.orders?Math.round(ytd/o.orders):null,months:cur,goal:o.goal};
      if(forDesign)r.projection=o.proj;
      return r;
    });
    const have={};
    if(!isSample)reps.forEach(r=>{const g=GOALS.find(x=>x.k===nk(r.name));if(g){have[g.k]=1;const v=T==='BIZ'?g.biz:g.rlt;if(v!=null)r.goal=v;}});
    if(!isSample)GOALS.forEach(g=>{const v=T==='BIZ'?g.biz:g.rlt;if(v==null||have[g.k])return;have[g.k]=1;const yrs={};years.forEach(y=>{yrs[y]=0;});const z={name:escH(g.name),years:yrs,ytd:0,ly_ytd:0,orders:0,avg:null,months:zero(),goal:v};if(forDesign)z.projection=null;reps.push(z);});
    reps.sort((a,b)=>b.ytd-a.ytd);
    const totals={};years.forEach(y=>{totals[y]=sum(monthly[y]);});
    types[T]={label:labels[T],monthly:monthly,totals:totals,ytd:sum(reps.map(r=>r.ytd)),ly_ytd:sum(reps.map(r=>r.ly_ytd)),orders_ytd:sum(reps.map(r=>r.orders)),reps:reps};
  });
  const out={asof:asof,year:Y,years:years,types:types,no_orders:[],pendingReps:!!(isSample&&GOALS.length)};
  if(forDesign){
    const B=types.BIZ;
    if(!B.reps.length)throw new Error('Add at least one BIZ (business gift) row.');
    if(!/^straight/i.test(ANS.pace||'')&&!(B.totals[Y-1]>0||B.totals[Y-2]>0))throw new Error('The scoreboard needs at least one earlier year of BIZ data to work out pace.');
    const gr=has(ANS.growth)?Number(ANS.growth)/100:0.1;
    if(!B.reps.some(r=>r.goal!=null)||has(ANS.growth))B.reps.forEach(r=>{if(r.goal==null&&(r.ytd>0||r.years[Y-1]>0))r.goal=Math.max(1000,Math.round(Math.max(r.years[Y-1],r.ytd)*(1+gr)/1000)*1000);});
    out.no_orders=B.reps.filter(r=>r.goal!=null&&!r.ytd&&!r.orders).map(r=>r.name);
    B.reps=B.reps.filter(r=>!(r.goal!=null&&!r.ytd&&!r.orders));

const T = D.types.BIZ;
const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = s => document.querySelector(s);
const money = v => v == null ? '—' : '$' + Math.round(v).toLocaleString('en-US');
const k = v => Math.abs(v) >= 1000 ? '$' + (v/1000).toFixed(Math.abs(v) >= 100000 ? 0 : 1) + 'K' : '$' + Math.round(v);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const Y = D.year, asof = new Date(D.asof + 'T12:00:00');
const mi = asof.getMonth(), dim = new Date(Y, mi + 1, 0).getDate(), dayFrac = asof.getDate() / dim;

// Seasonal pace: share of a year's business gifts usually done by this date (average of earlier years).
const past = D.years.filter(y => y < Y);
const STRAIGHT = /^straight/i.test(ANS.pace || '');
const CLOSE = Math.min(1, Math.max(0, (has(ANS.behind) ? Number(ANS.behind) : 90) / 100));
const GY = has(ANS.goalYear) ? Math.round(Number(ANS.goalYear)) : Y;
function shareBy(m, f){
  if (STRAIGHT) return (m + f) / 12;
  const s = past.map(y => { const a = T.monthly[y], tot = a.reduce((x,z)=>x+z,0); if(!tot) return null;
    let c = 0; for (let i=0;i<m;i++) c += a[i]; c += a[m]*f; return c/tot; }).filter(x => x != null);
  return s.reduce((a,b)=>a+b,0)/s.length;
}
const FR = shareBy(mi, dayFrac);
const monthsLeft = 12 - mi - dayFrac;

const reps = T.reps.filter(r => r.goal != null);
const noOrders = D.no_orders || [];
const divGoal = reps.reduce((a,r)=>a+r.goal,0);
const divProj = reps.reduce((a,r)=>a+(r.projection||r.goal),0);
const divYtd = T.ytd, divPace = divGoal*FR, divFore = divYtd/FR;
function status(ytd, goal){
  const p = goal*FR, r = p ? ytd/p : 0;
  if (r >= 1) return {c:'up', t:'Ahead of pace'};
  if (r >= CLOSE) return {c:'mid', t:'Close to pace'};
  return {c:'down', t:'Behind pace'};
}
const gap = (ytd, goal) => ytd - goal*FR;
const gapTxt = (ytd, goal) => { const g = gap(ytd,goal); return g >= 0 ? `${k(g)} ahead` : `${k(-g)} behind`; };
const needMo = (ytd, goal) => Math.max(0, goal - ytd) / monthsLeft;

$('#yr').textContent = Y;
$('#asof').textContent = `Data through ${asof.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})} · ${reps.length} ${REPS}`;
if (ANS.team) $('#eyebrow').textContent = ANS.team;
const lyYtd = T.ly_ytd, vsLy = lyYtd > 0 ? (divYtd - lyYtd)/lyYtd : 0;
const vsHtml = () => lyYtd > 0 ? `<span class="${vsLy>=0?'up':'down'} b">${vsLy>=0?'+':''}${(vsLy*100).toFixed(0)}%</span>` : '<span class="muted b">new</span>';

function kpis(){
  const s = status(divYtd, divGoal);
  return `<div class="kpis">
    <div class="card kpi"><div class="l">Division so far</div><div class="v">${money(divYtd)}</div><div class="n">${vsHtml()} vs same date ${Y-1}</div></div>
    <div class="card kpi"><div class="l">Division goal</div><div class="v">${money(divGoal)}</div><div class="n">Team projection ${money(divProj)}</div></div>
    <div class="card kpi"><div class="l">Pace today</div><div class="v ${s.c}">${gapTxt(divYtd, divGoal)}</div><div class="n">Should be at ${money(divPace)} by now</div></div>
    <div class="card kpi"><div class="l">On track to finish</div><div class="v">${money(divFore)}</div><div class="n">${Math.round(divFore/divGoal*100)}% of goal at this speed</div></div>
  </div>`;
}

// cumulative series
function cum(a, upto){ let c=0; return a.map((v,i)=> i>upto ? null : (c+=v)); }
function paceLine(goal){ return M.map((_,i)=> Math.round(goal*shareBy(i,1))); }
const charts = {};
function trendChart(id, big){
  const cur = cum(T.monthly[Y], mi), ly = cum(T.monthly[Y-1], 11);
  charts[id] = new Chart(document.getElementById(id), {type:'line', data:{labels:M, datasets:[
    {label:`${Y}`, data:cur, borderColor:css('--copper'), backgroundColor:css('--copper'), borderWidth:3, pointRadius:0, tension:.25},
    {label:'Pace to goal', data:paceLine(divGoal), borderColor:css('--pace'), borderDash:[6,5], borderWidth:2, pointRadius:0, tension:.25},
    {label:`${Y-1}`, data:ly, borderColor:css('--ly'), borderWidth:2, pointRadius:0, tension:.25},
  ]}, options:{maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
    plugins:{legend:{position:'bottom',labels:{color:css('--muted'),boxWidth:14,font:{family:'Manrope',weight:'600'}}},
      tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${money(c.parsed.y)}`}}},
    scales:{x:{grid:{display:false},ticks:{color:css('--muted')}}, y:{grid:{color:css('--grid')},ticks:{color:css('--muted'),callback:v=>k(v)}}}}});
}

// ---------- Option 1: Scoreboard ----------
function o1(){
  const list = [...reps].sort((a,b)=> b.ytd/b.goal - a.ytd/a.goal);
  const scale = 1;
  const rows = list.map((r,i)=>{ const s = status(r.ytd,r.goal), w = Math.min(100, r.ytd/r.goal/scale*100), t = FR/scale*100;
    return `<div class="rrow"><div class="rank">${i+1}</div>
      <div class="rname">${r.name}<small>${r.ytd >= r.goal ? '<b class="up">Goal reached</b> · ' : ''}${Math.round(r.ytd/r.goal*100)}% of ${k(r.goal)} goal</small></div>
      <div class="track"><div class="fill" style="width:${w}%;background:var(--${s.c})"></div><div class="tick" style="left:${t}%" title="Where they should be today"></div></div>
      <div class="rnum"><span class="b">${money(r.ytd)}</span><br><span class="${s.c} b">${gapTxt(r.ytd,r.goal)}</span></div></div>`; }).join('');
  $('#o1').innerHTML = kpis() + `
    <div class="card"><h2>Race to goal</h2><div class="h2n">Ranked by how much of their own goal each person has done. The dark line on each bar is where they should be today.</div>
      <div class="race">${rows}</div>
      <div class="legend"><span><i style="background:var(--up)"></i>Ahead of pace</span><span><i style="background:var(--mid)"></i>Close</span><span><i style="background:var(--down)"></i>Behind</span><span><i style="background:var(--pace);width:3px"></i>Pace today</span></div></div>
    <div class="card"><h2>Division trend line</h2><div class="h2n">Running total this year, against the pace to goal and last year.</div><div class="chart"><canvas id="c1"></canvas></div></div>`;
  trendChart('c1');
}

// ---------- Option 2: Trend line first ----------
function spark(a){
  const v = a.slice(0, mi+1), mx = Math.max(1, ...v), w = 96, h = 26, bw = w/12;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${a.map((x,i)=> i>mi ? `<rect x="${i*bw+1}" y="${h-2}" width="${bw-2}" height="2" fill="var(--track)"/>` :
    `<rect x="${i*bw+1}" y="${h - Math.max(2, x/mx*h)}" width="${bw-2}" height="${Math.max(2, x/mx*h)}" rx="1" fill="var(--copper)"/>`).join('')}</svg>`;
}
function o2(){
  const s = status(divYtd, divGoal);
  const rows = reps.map(r=>{ const st = status(r.ytd,r.goal); return `<tr>
    <td class="name">${r.name}</td><td>${money(r.ytd)}</td><td>${money(r.goal)}</td>
    <td><span class="pill ${st.c}">${gapTxt(r.ytd,r.goal)}</span></td>
    <td>${money(r.ytd/FR)}</td><td>${spark(r.months)}</td></tr>`; }).join('');
  $('#o2').innerHTML = `
    <div class="hero2">
      <div class="card"><h2>Division trend line</h2><div class="h2n">Running total this year, against the pace to goal and last year.</div><div class="chart big"><canvas id="c2"></canvas></div></div>
      <div class="card side">
        <div class="eyebrow">So far</div><div class="big">${money(divYtd)}</div>
        <p>${vsHtml()} vs same date ${Y-1}</p><hr>
        <div class="eyebrow">Goal</div><div class="big">${money(divGoal)}</div>
        <p>Team projection ${money(divProj)}. <span class="${s.c} b">${gapTxt(divYtd,divGoal)}</span> of pace.</p><hr>
        <div class="eyebrow">On track to finish</div><div class="big">${money(divFore)}</div>
        <p>${STRAIGHT ? 'If the rest of the year goes like so far.' : 'If the rest of the year goes like other years.'}</p>
      </div>
    </div>
    <div class="card"><h2>Each ${REP}</h2><div class="h2n">Pace = where they should be today to hit their goal. Bars = each month this year.</div>
      <div class="tablewrap"><table><thead><tr><th>Name</th><th>So far</th><th>Goal</th><th>Pace</th><th>On track for</th><th>${Y} by month</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  trendChart('c2', true);
}

// ---------- Option 3: Person cards ----------
function ring(p, size, col){
  const r = size/2 - 7, C = 2*Math.PI*r, f = Math.min(1,p);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p*100)}% of goal">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--${col})" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <line x1="${size/2}" y1="${size/2 - r - 8}" x2="${size/2}" y2="${size/2 - r + 8}" stroke="var(--pace)" stroke-width="2.5" transform="rotate(${FR*360} ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" class="ringtxt" style="font-size:${size>120?24:15}px">${Math.round(p*100)}%</text></svg>`;
}
function o3(){
  const s = status(divYtd, divGoal);
  const cards = [...reps].sort((a,b)=>b.ytd-a.ytd).map(r=>{ const st = status(r.ytd,r.goal), col = st.c; return `<div class="card pc">
    <div class="top">${ring(r.ytd/r.goal, 74, col)}<div><div class="nm">${r.name}</div><span class="pill ${st.c}">${st.t}</span></div></div>
    <div class="line"><span class="muted">So far</span><span class="b">${money(r.ytd)}</span></div>
    <div class="line"><span class="muted">Goal</span><span>${money(r.goal)}</span></div>
    <div class="line"><span class="muted">vs same date ${Y-1}</span><span>${money(r.ly_ytd)}</span></div>
    <div class="need">${r.ytd >= r.goal ? '<b class="up">Goal reached.</b> Everything now is extra.' : `To hit goal: <b>${money(needMo(r.ytd,r.goal))}</b> a month from now on.`}</div>
  </div>`; }).join('') + noOrders.map(n=>`<div class="card pc"><div class="nm">${n}</div><span class="pill none">No orders found yet</span></div>`).join('');
  $('#o3').innerHTML = `
    <div class="card divcard">${ring(divYtd/divGoal, 150, s.c)}
      <div><div class="eyebrow">Whole division</div><h2 style="font-size:26px">${money(divYtd)} of ${money(divGoal)}</h2>
      <div class="sub"><span class="${s.c} b">${gapTxt(divYtd,divGoal)}</span> of pace · on track to finish at <b>${money(divFore)}</b> · ${vsHtml()} vs ${Y-1}</div>
      <div class="sub" style="margin-top:6px">The small dark mark on each circle is where the person should be today.</div></div></div>
    <div class="cards">${cards}</div>
    <div class="card"><h2>Division trend line</h2><div class="h2n">Running total this year, against the pace to goal and last year.</div><div class="chart"><canvas id="c3"></canvas></div></div>`;
  trendChart('c3');
}

const DESC = {
  1:'Like the Western Region scoreboard: 4 numbers on top, then everyone ranked in a race to their own goal. Easiest to compare people.',
  2:'The division trend line is the star. Below it, one plain table, one row per person, with small monthly bars.',

};
const built = {};
function show(o){

  ['1','2','3'].forEach(x=> $('#o'+x).hidden = x!==o);

}
document.querySelectorAll('.picker button').forEach(b=> b.onclick = ()=>show(b.dataset.o));
show('1');
$('#foot').innerHTML = `Only orders tagged <b>Business gift</b> count. "Pace" ` + (STRAIGHT ? `is a straight line through the year:` : `uses how business gifts usually spread across the year (${past.join(' and ')}):`) + ` by ${M[mi]} ${asof.getDate()} the division ` + (STRAIGHT ? 'should have' : 'normally has') + ` ${Math.round(FR*100)}% of its year done.`
  + (GY !== Y ? ` Goals shown are your ${GY} goals, measured here against ${Y} sales so far.` : '')

if (window.EvergreenSetup) EvergreenSetup.init({
  id: SETUP_ID,
