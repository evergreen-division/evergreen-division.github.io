<style>

<script>
window.EGD=(function(){
  var cfg,KEY;
  function parseCSV(text){
    text=String(text).replace(/^﻿/,'');
    var rows=[],row=[],f='',q=false,i,c;
    for(i=0;i<text.length;i++){c=text[i];
      if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
      else if(c==='"')q=true;
      else if(c===','){row.push(f);f='';}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
      else f+=c;
    }
    if(f!==''||row.length){row.push(f);rows.push(row);}
    rows=rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
    if(rows.length<2)throw new Error('Need a header row and at least one data row.');
    var head=rows[0].map(function(h){return String(h).trim().toLowerCase().replace(/\s+/g,'_');});
    var miss=cfg.required.filter(function(c){return head.indexOf(c)<0;});
    if(miss.length)throw new Error('Missing column(s): '+miss.join(', '));
    return rows.slice(1).map(function(r){var o={};head.forEach(function(h,j){o[h]=(r[j]==null?'':String(r[j]).trim());});return o;});
  }
  function load(text,isSample){return cfg.build(parseCSV(text),isSample);}
  function el(tag,attrs,html){var e=document.createElement(tag);for(var k in (attrs||{}))e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e;}
  function mount(isSample){
    var banner=el('div',{'class':'egd-banner'});
    banner.appendChild(el('span',{},isSample?'Sample data — load your own to see your team.':'Showing your data (kept only in this browser).'));
    var open=el('button',{'class':'egd-btn pri',type:'button'},'Load your own data');
    banner.appendChild(open);
    var ov=el('div',{'class':'egd-ov',hidden:''});
    var panel=el('div',{'class':'egd-panel',role:'dialog','aria-label':'Load your own data'});
    panel.innerHTML='<h3>Load your own data</h3><p>Upload a CSV file or paste CSV text. It is read only in your browser and saved in this browser’s local storage. Nothing is sent anywhere.</p><p><b>Expected columns</b> (first row = header):</p><code></code><p>'+cfg.help+'</p>';
    panel.querySelector('code').textContent=cfg.columns.join(',');
    var file=el('input',{type:'file',accept:'.csv,text/csv,text/plain'});
    var ta=el('textarea',{placeholder:'Or paste CSV text here',spellcheck:'false'});
    var err=el('div',{'class':'egd-err'});
    var row=el('div',{'class':'egd-row'});
    var go=el('button',{'class':'egd-btn pri',type:'button'},'Load data');
    var tpl=el('a',{'class':'egd-btn',href:'#',download:cfg.filename},'Download CSV template');
    var rst=el('button',{'class':'egd-btn',type:'button'},'Reset to sample');
    var cl=el('button',{'class':'egd-btn',type:'button'},'Close');
    [go,tpl,rst,cl].forEach(function(b){row.appendChild(b);});
    [file,ta,err,row].forEach(function(n){panel.appendChild(n);});
    ov.appendChild(panel);
    try{tpl.href=URL.createObjectURL(new Blob([cfg.sample],{type:'text/csv'}));}catch(e){tpl.href='data:text/csv;charset=utf-8,'+encodeURIComponent(cfg.sample);}
    function reset(){try{localStorage.removeItem(KEY);}catch(e){}try{if(window.EvergreenSetup&&cfg.setup)EvergreenSetup.reset(cfg.setup);}catch(e){}location.reload();}
    open.onclick=function(){err.textContent='';ov.hidden=false;};
    cl.onclick=function(){ov.hidden=true;};
    ov.addEventListener('click',function(e){if(e.target===ov)ov.hidden=true;});
    rst.onclick=reset;
    function apply(){
      var text=ta.value;err.textContent='';
      try{load(text,false);}catch(e){err.textContent='Could not read that data: '+e.message;return;}
      try{localStorage.setItem(KEY,text);}catch(e){err.textContent='Your browser blocked local storage, so the data cannot be saved.';return;}
      location.reload();
    }
    go.onclick=apply;
    file.onchange=function(){var f=file.files&&file.files[0];if(!f)return;var r=new FileReader();r.onload=function(){ta.value=String(r.result);apply();};r.readAsText(f);};
    if(!isSample){var b2=el('button',{'class':'egd-btn',type:'button'},'Reset to sample');b2.onclick=reset;banner.appendChild(b2);}
    document.body.insertBefore(banner,document.body.firstChild);
    document.body.appendChild(ov);
  }
  return {init:function(c){
    cfg=c;KEY=c.key;var saved=null,D=null,isSample=true;
    try{saved=localStorage.getItem(KEY);}catch(e){}
    if(saved){try{D=load(saved,false);isSample=false;}catch(e){D=null;}}
    if(!D)D=load(c.sample,true);
    mount(isSample);
    return D;
  }};
})();
</script>

<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Evergreen Division</div>
      <h1 id="title">Business Gifts</h1>
      <div class="sub" id="asof"></div>
    </div>
    <div class="toggle" role="tablist">
      <button class="on" data-t="BIZ">Business gifts</button>
      <button data-t="RLT">Realtor gifts</button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="goalnote" id="goalnote"></div>

  <section class="grid2">
    <div class="card">
      <h2>Year to date, month by month</h2>
      <div class="h2n">Running total for each year. Same month, same point in the year.</div>
      <div class="chart"><canvas id="cum"></canvas></div>
    </div>
    <div class="card">
      <h2>Each month</h2>
      <div class="h2n" id="monthsNote"></div>
      <div class="chart"><canvas id="mon"></canvas></div>
    </div>
  </section>

  <section class="card">
    <h2 id="repH">By CSP</h2>
    <div class="h2n" id="repNote"></div>
    <div class="tablewrap"><table id="reps"></table></div>
  </section>

  <footer id="foot"></footer>
</div>

<script src="../shared/setup-interview.js"></script>
<script>
const SETUP_ID='business-gifts';
const ANS=(function(){try{return (window.EvergreenSetup&&EvergreenSetup.answers(SETUP_ID))||{};}catch(e){return {};}})();
const ANS_USED=JSON.stringify(ANS);
const has=v=>v!==''&&v!=null&&isFinite(Number(v));
const nk=s=>{const p=String(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').trim().split(/\s+/).filter(Boolean);return p.length?p[0]+(p[1]?' '+p[1][0]:''):'';};
const REP=['CSP','Rep','Manager'].indexOf(ANS.repWord)>=0?ANS.repWord:'CSP', REPS=REP+'s';
const escH=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function buildGifts(rows, forDesign, isSample){
  const MO=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[$,\s]/g,''));return isFinite(n)?n:0;};
  const opt=v=>{if(v==null||String(v).trim()==='')return null;const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)?n:null;};
  const GOALS=(Array.isArray(ANS.reps)?ANS.reps:[]).map(r=>({k:nk(r.name),name:String(r.name||'').trim(),biz:opt(r.biz),rlt:opt(r.rlt)})).filter(g=>g.k);
  const recs=rows.map(r=>({type:/^r/i.test(r.type||'')?'RLT':'BIZ',name:(r.name||'').trim(),year:parseInt(r.year,10),m:MO.map(k=>num(r[k])),orders:num(r.orders),goal:opt(r.goal),proj:opt(r.projection)})).filter(x=>x.name&&x.year>1900);
  if(!recs.length)throw new Error('No usable rows (each row needs a name and a year).');
  const Y=Math.max(...recs.map(x=>x.year)), years=[Y-2,Y-1,Y];
  const now=new Date(), pad=n=>String(n).padStart(2,'0');
  const asof=isSample?'2026-11-03':(now.getFullYear()===Y?`${Y}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`:`${Y}-12-31`);
  const ad=new Date(asof+'T12:00:00'), cm=ad.getMonth(), frac=ad.getDate()/new Date(Y,cm+1,0).getDate();
  const sum=a=>a.reduce((x,z)=>x+z,0);
  const zero=()=>Array(12).fill(0);
  const toDate=a=>Math.round(sum(a.slice(0,cm))+a[cm]*frac);
  const labels={BIZ:'Business gifts',RLT:'Realtor gifts'};
  const types={};
  ['BIZ','RLT'].forEach(T=>{
    const byName={};
    recs.filter(x=>x.type===T).forEach(x=>{
      const o=byName[x.name]||(byName[x.name]={name:x.name,y:{},orders:0,goal:null,proj:null});
      const cur=o.y[x.year]||(o.y[x.year]=zero());
      x.m.forEach((v,i)=>{cur[i]+=v;});
      if(x.year===Y)o.orders+=x.orders;
      if(x.goal!=null)o.goal=x.goal;
      if(x.proj!=null)o.proj=x.proj;
    });
    const monthly={};years.forEach(y=>{monthly[y]=zero();});
    const reps=Object.values(byName).map(o=>{
      const yrs={};
      years.forEach(y=>{const a=o.y[y]||zero();yrs[y]=sum(a);a.forEach((v,i)=>{monthly[y][i]+=v;});});
      const cur=o.y[Y]||zero(), ly=o.y[Y-1]||zero(), ytd=sum(cur);
      const r={name:o.name,years:yrs,ytd:ytd,ly_ytd:toDate(ly),orders:o.orders,avg:o.orders?Math.round(ytd/o.orders):null,months:cur,goal:o.goal};
      if(forDesign)r.projection=o.proj;
      return r;
    });
    const have={};
    if(!isSample)reps.forEach(r=>{const g=GOALS.find(x=>x.k===nk(r.name));if(g){have[g.k]=1;const v=T==='BIZ'?g.biz:g.rlt;if(v!=null)r.goal=v;}});
    if(!isSample)GOALS.forEach(g=>{const v=T==='BIZ'?g.biz:g.rlt;if(v==null||have[g.k])return;have[g.k]=1;const yrs={};years.forEach(y=>{yrs[y]=0;});const z={name:escH(g.name),years:yrs,ytd:0,ly_ytd:0,orders:0,avg:null,months:zero(),goal:v};if(forDesign)z.projection=null;reps.push(z);});
    reps.sort((a,b)=>b.ytd-a.ytd);
    const totals={};years.forEach(y=>{totals[y]=sum(monthly[y]);});
    types[T]={label:labels[T],monthly:monthly,totals:totals,ytd:sum(reps.map(r=>r.ytd)),ly_ytd:sum(reps.map(r=>r.ly_ytd)),orders_ytd:sum(reps.map(r=>r.orders)),reps:reps};
  });
  const out={asof:asof,year:Y,years:years,types:types,no_orders:[],pendingReps:!!(isSample&&GOALS.length)};
  if(forDesign){
    const B=types.BIZ;
    if(!B.reps.length)throw new Error('Add at least one BIZ (business gift) row.');
    if(!(B.totals[Y-1]>0||B.totals[Y-2]>0))throw new Error('The scoreboard needs at least one earlier year of BIZ data to work out pace.');
    if(!B.reps.some(r=>r.goal!=null))B.reps.forEach(r=>{if(r.ytd>0||r.years[Y-1]>0)r.goal=Math.max(1000,Math.round(Math.max(r.years[Y-1],r.ytd)*1.1/1000)*1000);});
    out.no_orders=B.reps.filter(r=>r.goal!=null&&!r.ytd&&!r.orders).map(r=>r.name);
    B.reps=B.reps.filter(r=>!(r.goal!=null&&!r.ytd&&!r.orders));
    if(!B.reps.some(r=>r.goal!=null))throw new Error('Add a goal for at least one person.');
  }
  return out;
}

BIZ,Jordan K.,2024,2750,2573,5961,9998,2876,1198,1755,6777,5364,2336,7709,2703,,,

const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = s => document.querySelector(s);
const money = v => v == null ? '—' : '$' + Math.round(v).toLocaleString('en-US');
const short = v => v >= 1000 ? '$' + (v/1000).toFixed(v >= 100000 ? 0 : 1) + 'K' : '$' + Math.round(v);
const pct = (a, b) => b > 0 ? (a - b) / b : null;
const pctTxt = p => p == null ? '<span class="muted">new</span>' : `<span class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '+' : ''}${(p*100).toFixed(0)}%</span>`;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const asof = new Date(D.asof + 'T12:00:00');
const asofTxt = asof.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
const curMonth = asof.getMonth();
const Y = D.year, LY = Y - 1;
let T = 'BIZ', charts = [];
const GY = has(ANS.goalYear) ? Math.round(Number(ANS.goalYear)) : Y + 1;
if (ANS.team) $('#eyebrow').textContent = ANS.team;
$('#repH').textContent = 'By ' + REP;
if (/^no/i.test(ANS.realtor || '')) document.querySelector('.toggle').style.display = 'none';

function render(){
  const t = D.types[T];
  $('#title').textContent = t.label;
  $('#asof').textContent = `Gift orders through ${asofTxt}`;
  const p = pct(t.ytd, t.ly_ytd);
  const avg = t.orders_ytd ? t.ytd / t.orders_ytd : null;
  const toBeat = t.totals[LY] - t.ytd;
  $('#kpis').innerHTML = `
    <div class="card kpi"><div class="l">${Y} so far</div><div class="v">${money(t.ytd)}</div><div class="n">${t.orders_ytd} orders</div></div>
    <div class="card kpi"><div class="l">vs same date ${LY}</div><div class="v">${pctTxt(p)}</div><div class="n">${money(t.ly_ytd)} by ${asof.toLocaleDateString('en-US',{month:'short',day:'numeric'})}, ${LY}</div></div>
    <div class="card kpi"><div class="l">Average order</div><div class="v">${money(avg)}</div><div class="n">${t.label.toLowerCase()} orders in ${Y}</div></div>
    <div class="card kpi"><div class="l">${LY} full year</div><div class="v">${money(t.totals[LY])}</div><div class="n">${toBeat > 0 ? money(toBeat) + ' to pass it' : '<span class="up">Already passed</span>'}</div></div>`;
  const hasGoals = t.reps.some(r => r.goal);
  $('#goalnote').innerHTML = hasGoals
    ? `<b>${GY} goals are in.</b> Each ${REP}'s goal is in the table below.`
    : `<b>${GY} goals:</b> add a goal column to your CSV, or type your ${REPS} and their goals into Setup, and each person's goal will show in the table below.`;
  if (D.pendingReps) $('#goalnote').innerHTML += `<br>Your ${REPS} and goals from Setup are saved. They appear in the table as soon as you load your own data.`;

  charts.forEach(c => c.destroy()); charts = [];
  const grid = css('--grid'), muted = css('--muted');
  const base = {responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
    plugins:{legend:{labels:{color:muted, boxWidth:12, font:{family:'Manrope'}}},
      tooltip:{callbacks:{label:c => ` ${c.dataset.label}: ${money(c.parsed.y)}`}}},
    scales:{x:{grid:{display:false}, ticks:{color:muted}}, y:{grid:{color:grid}, ticks:{color:muted, callback:v => short(v)}, beginAtZero:true}}};
  const cumDs = D.years.map(y => {
    let s = 0;
    const arr = t.monthly[y].map((v, i) => (y == Y && i > curMonth) ? null : (s += v));
    return {label: String(y), data: arr, borderColor: css('--y' + y) || muted, backgroundColor: css('--y' + y) || muted,
      borderWidth: y == Y ? 3.5 : 2, pointRadius: y == Y ? 3 : 0, tension: .25, spanGaps:false};
  });
  charts.push(new Chart($('#cum'), {type:'line', data:{labels:M, datasets:cumDs}, options:base}));
  $('#monthsNote').textContent = `${LY} vs ${Y}. ${M[curMonth]} ${Y} is only through ${asof.getDate()} ${M[curMonth]}.`;
  charts.push(new Chart($('#mon'), {type:'bar', data:{labels:M, datasets:[
    {label:String(LY), data:t.monthly[LY], backgroundColor:css('--y' + LY), borderRadius:4},
    {label:String(Y), data:t.monthly[Y].map((v,i) => i > curMonth ? null : v), backgroundColor:css('--y' + Y), borderRadius:4}]}, options:base}));

  const reps = t.reps.filter(r => r.ytd >= 1000 || r.years[LY] >= 1000 || r.goal);
  const max = Math.max(1, ...reps.map(r => r.ytd));
  $('#repNote').textContent = `${t.label} per person, ${Y} to date vs the same date in ${LY}. Sorted by ${Y} so far. "New" = under $1,000 at this point last year.`;
  $('#reps').innerHTML = `<thead><tr><th>${REP}</th><th>${Y} so far</th><th>Same date ${LY}</th><th>Change</th><th class="hide-sm">Orders</th><th class="hide-sm">Avg order</th><th>${LY} full</th><th class="hide-sm">${Y-2} full</th><th>${GY} goal</th></tr></thead><tbody>` +
    reps.map(r => `<tr><td class="name">${r.name}<div class="bar" style="width:${Math.max(2, r.ytd / max * 100)}%"></div></td>
      <td><b>${money(r.ytd)}</b></td><td>${money(r.ly_ytd)}</td><td>${r.ly_ytd >= 1000 ? pctTxt(pct(r.ytd, r.ly_ytd)) : (r.ytd ? '<span class="muted">new</span>' : '—')}</td>
      <td class="hide-sm">${r.orders || '—'}</td><td class="hide-sm">${money(r.avg)}</td><td>${money(r.years[LY])}</td><td class="hide-sm">${money(r.years[Y-2])}</td>
      <td>${r.goal ? money(r.goal) : '<span class="muted">—</span>'}</td></tr>`).join('') + '</tbody>';
  $('#foot').innerHTML = `Source: the data loaded on this page, ${D.years[0]} to ${asofTxt}. Only rows with type <b>${T}</b> (${t.label.toLowerCase()}) count here. "Same date" compares January 1 to ${asof.toLocaleDateString('en-US',{month:'long',day:'numeric'})} of each year.`;
}
document.querySelectorAll('.toggle button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.toggle button').forEach(x => x.classList.toggle('on', x === b));
  T = b.dataset.t; render();
});
render();

  id: SETUP_ID,
  title: 'Set up your business-gifts page',
  intro: 'A few quick questions so the labels, goals and people on this page match your team. About 3 minutes. Everything is optional.',
  questions: [
    {key:'team', q:'What should this page call your team?', why:'Shown at the top of the page so people know whose numbers these are. You can add your Vector Connect office number (Vector Connect is the order system Cutco offices use).', type:'text', optional:true, example:'Evergreen Division · Office #1234', placeholder:'e.g. Evergreen Division · Office #1234'},
    {key:'repWord', q:'What do you call the people listed on this page?', why:'A CSP (Cutco Sales Professional) is a senior rep. Pick the word your team uses; it replaces the labels and column heading.', type:'choice', options:['CSP','Rep','Manager'], example:'CSP'},
    {key:'realtor', q:'Do you want to see realtor gifts too?', why:'Orders in Vector Connect are tagged BIZ (business gift) or RLT (realtor gift) by whoever enters them, and only tagged orders show up here. If you do not sell to realtors, hide that view. (Business-gifts dashboard only.)', type:'choice', options:['Yes, show both','No, business gifts only'], example:'Yes, show both'},
    {key:'goalYear', q:'Which year are your goals for?', why:'Sets the label on the goal column and goal notes in the business-gifts dashboard. Leave it blank to use next year. The scoreboard designs always measure goals against this year\u2019s pace.', type:'number', optional:true, example:'2027', placeholder:'e.g. 2027'},
    {key:'reps', q:'Who are your CSPs, and what is each person’s goal for the year?', why:'Goals are whole-year dollars. Use the name as it appears in your data (first name and last initial is enough). Leave a goal blank if someone has none. These combine with your uploaded data: matching names get the goal, and anyone missing from your data shows at $0 so far.', type:'list', optional:true, fields:[{key:'name',label:'Name'},{key:'biz',label:'Business-gift goal ($)',type:'number'},{key:'rlt',label:'Realtor-gift goal ($)',type:'number'}], example:'Jordan K. · $60,000 business · $25,000 realtor'},
    {key:'growth', q:'If someone has no goal, how much growth over last year should we assume?', why:'In percent. Anyone without a goal gets last year’s total (or this year so far, if higher) plus this growth. (Scoreboard designs only.)', type:'number', optional:true, example:'10', placeholder:'e.g. 10'},
    {key:'pace', q:'How should the scoreboard decide where each person should be today?', why:'Gift sales are lumpy, for example heavy near year end. Seasonal pace uses how much of the year was usually done by this date in your earlier years, so it needs at least one earlier year of data. Straight line works for a brand new team. (Scoreboard designs only.)', type:'choice', options:['Seasonal: follow earlier years','Straight line: same each month'], example:'Seasonal: follow earlier years'},
    {key:'behind', q:'Below what percent of pace is someone “behind”?', why:'At or above 100% of where they should be today is “ahead”. Between this number and 100% is “close”. Under this number shows red as “behind”. (Scoreboard designs only.)', type:'number', optional:true, example:'90', placeholder:'e.g. 90'}
  ],
  onDone(a){ if (JSON.stringify(a || {}) !== ANS_USED) location.reload(); }
});
</script>
