<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evergreen Business Gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: header + 4 numbers, then 3 tabs (Scoreboard / Trend line / People); 2027 plan card under every tab. */
:root{
  --bg:#f6f2e8; --card:#fffdf8; --ink:#1e2a24; --muted:#6b6f63; --line:#e3dccb;
  --forest:#1e3a2f; --copper:#b0764a; --copper-2:#966139; --cream:#efe9dc;
  --up:#2e7d4f; --mid:#b8862b; --down:#b3412f; --grid:rgba(30,42,36,.08); --track:#ebe4d3;
  --ly:#9fb3a6; --pace:#1e3a2f;
  --l1:#1e3a2f; --l2:#b0764a; --l3:#7f9c8a; --l4:#c9bfa8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a17; --card:#1c241f; --ink:#ece6d8; --muted:#a39f92; --line:#2d3832;
    --forest:#cfe0d4; --copper:#d39a6c; --copper-2:#e0ad83; --cream:#232d27;
    --up:#6fcf97; --mid:#e2b45a; --down:#ef8a75; --grid:rgba(236,230,216,.08); --track:#2a352f; --ly:#5e7a6a; --pace:#cfe0d4;
    --l1:#cfe0d4; --l2:#d39a6c; --l3:#6f9a83; --l4:#5b5a50; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a17; --card:#1c241f; --ink:#ece6d8; --muted:#a39f92; --line:#2d3832;
  --forest:#cfe0d4; --copper:#d39a6c; --copper-2:#e0ad83; --cream:#232d27;
  --up:#6fcf97; --mid:#e2b45a; --down:#ef8a75; --grid:rgba(236,230,216,.08); --track:#2a352f; --ly:#5e7a6a; --pace:#cfe0d4;
  --l1:#cfe0d4; --l2:#d39a6c; --l3:#6f9a83; --l4:#5b5a50; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);font-weight:700}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(26px,4vw,36px);margin:4px 0 2px;color:var(--forest);line-height:1.1;text-wrap:balance}
h2{font-family:"Playfair Display",Georgia,serif;font-size:20px;margin:0 0 4px;color:var(--forest)}
.sub,.h2n{color:var(--muted);font-size:13.5px}
.h2n{margin-bottom:12px}
.seg{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--muted);font:700 14px Manrope,sans-serif;padding:8px 15px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--forest);color:var(--bg)}
.seg button:focus-visible,.tabs button:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--muted);font:700 15px Manrope,sans-serif;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--forest);border-bottom-color:var(--copper)}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:clamp(22px,3vw,30px);font-weight:800;margin-top:6px;color:var(--forest)}
.kpi .n{font-size:13px;color:var(--muted);margin-top:4px}
.up{color:var(--up)}.mid{color:var(--mid)}.down{color:var(--down)}
.b{font-weight:800}
.muted{color:var(--muted)}
.chart{position:relative;height:280px}
.chart.big{height:360px}
.stack{display:grid;gap:14px}
.note{background:var(--cream);border:1px dashed var(--copper);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.note b{color:var(--copper-2)}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.up{background:color-mix(in srgb,var(--up) 14%,transparent)}
.pill.mid{background:color-mix(in srgb,var(--mid) 16%,transparent)}
.pill.down{background:color-mix(in srgb,var(--down) 14%,transparent)}
.pill.none{background:var(--cream);color:var(--muted)}
/* Scoreboard */
.rrow{display:grid;grid-template-columns:28px minmax(120px,190px) minmax(0,1fr) minmax(150px,210px);gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rank{font-weight:800;color:var(--muted);text-align:right}
.rname{font-weight:800}
.rname small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.track{position:relative;height:14px;background:var(--track);border-radius:7px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--pace)}
.rnum{text-align:right;font-size:13.5px}
.rnum .b{font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.others{font-size:13px;color:var(--muted);margin-top:10px}
/* Trend line */
.hero2{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
.side .big{font-size:32px;font-weight:800;color:var(--forest);margin:4px 0}
.side p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.name{font-weight:800}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* People */
.divcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{display:grid;gap:10px;align-content:start}
.pc .top{display:flex;gap:12px;align-items:center}
.pc .nm{font-weight:800;font-size:16px}
.pc .line{display:flex;justify-content:space-between;font-size:13.5px}
.pc .need{background:var(--cream);border-radius:10px;padding:8px 10px;font-size:13px}
.ringtxt{font-weight:800;fill:var(--forest)}
/* 2027 plan */
.plan .bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--track);margin:10px 0}
.plan .bar span{display:block;height:100%}
.plan .keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.plan .keys div{font-size:13px;color:var(--muted)}
.plan .keys b{display:block;font-size:16px;color:var(--forest)}
.plan .keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
/* National */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.drow{display:grid;grid-template-columns:28px minmax(110px,170px) minmax(0,1fr) minmax(86px,auto) 64px;gap:10px;align-items:center;padding:6px 4px;font-size:13.5px}
.drow .track{height:12px}
.drow.home{background:color-mix(in srgb,var(--copper) 12%,transparent);border-radius:8px}
.drow.home .rname{color:var(--copper-2)}
.drow.gap{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
tr.home td{background:color-mix(in srgb,var(--copper) 12%,transparent)}
.callout{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
td.txt{white-space:normal;text-align:left;min-width:150px}
td.l{text-align:left}
th.l{text-align:left}
footer{color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:18px}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .v{font-size:20px;overflow-wrap:anywhere}
  .kpi .l{font-size:10.5px}
  .card{padding:13px}
  .hero2{grid-template-columns:minmax(0,1fr)}
  .chart.big{height:260px}
  .chart{height:240px}
  .rrow{grid-template-columns:22px minmax(0,1fr) auto;gap:6px 10px}
  .rrow .track{grid-column:2 / 4;grid-row:2}
  .rnum{font-size:12.5px}
  .divcard{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
  .plan .keys{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .drow{grid-template-columns:22px minmax(0,1fr) auto 52px;gap:4px 8px}
  .drow .track{grid-column:2 / 5;grid-row:2}
  td.name{position:sticky;left:0;background:var(--card)}
}
.egd-banner{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;padding:8px 12px;background:var(--cream,var(--panel,#efe9dc));border-bottom:1px solid var(--line,var(--rule,#dcd3bf));color:var(--ink,#1e2a24);font:600 12.5px/1.4 Manrope,Inter,-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}
.egd-btn{border:1px solid var(--line,var(--rule,#dcd3bf));background:var(--card,#fff);color:var(--ink,#1e2a24);font:700 12px/1 Manrope,Inter,-apple-system,BlinkMacSystemFont,sans-serif;padding:7px 11px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.egd-btn.pri{background:var(--forest,var(--ink,#1e3a2f));color:var(--bg,var(--ground,#fff));border-color:var(--forest,var(--ink,#1e3a2f))}
.egd-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.egd-ov[hidden]{display:none!important}
.egd-panel{background:var(--card,#fff);color:var(--ink,#1e2a24);border:1px solid var(--line,var(--rule,#dcd3bf));border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px;font:13.5px/1.5 Manrope,Inter,-apple-system,BlinkMacSystemFont,sans-serif;text-align:left}
.egd-panel h3{margin:0 0 6px;font-size:17px}
.egd-panel p{margin:0 0 10px;color:var(--muted,#6b6f63)}
.egd-panel code{display:block;background:var(--cream,var(--panel,#efe9dc));border-radius:8px;padding:8px 10px;font:12px/1.5 ui-monospace,Menlo,monospace;word-break:break-word;margin-bottom:10px;color:var(--ink,#1e2a24)}
.egd-panel textarea{width:100%;min-height:110px;box-sizing:border-box;border:1px solid var(--line,var(--rule,#dcd3bf));border-radius:8px;padding:8px;background:var(--bg,var(--ground,#fff));color:var(--ink,#1e2a24);font:12px/1.4 ui-monospace,Menlo,monospace;margin:6px 0 10px}
.egd-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.egd-err{color:var(--down,#b3412f);font-weight:700;margin-bottom:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Evergreen Division</div>
      <h1 id="title"></h1>
      <div class="sub" id="asof"></div>
    </div>
    <div class="seg" id="types">
      <button data-t="BIZ" class="on">Business gifts</button>
      <button data-t="RLT">Realtor gifts</button>
    </div>
  </header>

  <div class="note" id="note" hidden></div>
  <section class="kpis" id="kpis"></section>

  <nav class="tabs" id="tabs">
    <button data-v="score" class="on">Scoreboard</button>
    <button data-v="trend">Trend line</button>
    <button data-v="people">People</button>
    <button data-v="nranks" class="nat">National ranks</button>
    <button data-v="ntrends" class="nat">National trends</button>
  </nav>

  <section id="v-score" class="stack"></section>
  <section id="v-trend" class="stack" hidden></section>
  <section id="v-people" class="stack" hidden></section>
  <section id="v-nranks" class="stack" hidden></section>
  <section id="v-ntrends" class="stack" hidden></section>

  <section class="card plan" id="plan" style="margin-top:14px" hidden></section>

  <footer id="foot"></footer>
</div>
<script>
window.EGD=(function(){
  var cfg,KEY;
  function parseCSV(text){
    text=String(text).replace(/^﻿/,'');
    var rows=[],row=[],f='',q=false,i,c;
    for(i=0;i<text.length;i++){c=text[i];
      if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
      else if(c==='"')q=true;
      else if(c===','){row.push(f);f='';}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
      else f+=c;
    }
    if(f!==''||row.length){row.push(f);rows.push(row);}
    rows=rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
    if(rows.length<2)throw new Error('Need a header row and at least one data row.');
    var head=rows[0].map(function(h){return String(h).trim().toLowerCase().replace(/\s+/g,'_');});
    var miss=cfg.required.filter(function(c){return head.indexOf(c)<0;});
    if(miss.length)throw new Error('Missing column(s): '+miss.join(', '));
    return rows.slice(1).map(function(r){var o={};head.forEach(function(h,j){o[h]=(r[j]==null?'':String(r[j]).trim());});return o;});
  }
  function load(text,isSample){return cfg.build(parseCSV(text),isSample);}
  function el(tag,attrs,html){var e=document.createElement(tag);for(var k in (attrs||{}))e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e;}
  function mount(isSample){
    var banner=el('div',{'class':'egd-banner'});
    banner.appendChild(el('span',{},isSample?'Sample data — load your own to see your team (national tabs always show sample data).':'Showing your data (kept only in this browser).'));
    var open=el('button',{'class':'egd-btn pri',type:'button'},'Load your own data');
    banner.appendChild(open);
    var ov=el('div',{'class':'egd-ov',hidden:''});
    var panel=el('div',{'class':'egd-panel',role:'dialog','aria-label':'Load your own data'});
    panel.innerHTML='<h3>Load your own data</h3><p>Upload a CSV file or paste CSV text. It is read only in your browser and saved in this browser’s local storage. Nothing is sent anywhere.</p><p><b>National tabs show sample data; they need your company’s national report.</b> Loading a CSV replaces only the team side: Scoreboard, Trend line and People.</p><p><b>National tabs show sample data; they need your company’s national report.</b> Loading a CSV replaces only the team side: Scoreboard, Trend line and People.</p><p><b>National tabs show sample data; they need your company’s national report.</b> Loading a CSV replaces only the team side: Scoreboard, Trend line and People.</p><p><b>National tabs show sample data; they need your company’s national report.</b> Loading a CSV replaces only the team side: Scoreboard, Trend line and People.</p><p><b>National tabs show sample data; they need your company’s national report.</b> Loading a CSV replaces only the team side: Scoreboard, Trend line and People.</p><p><b>National tabs show sample data; they need your company’s national report.</b> Loading a CSV replaces only the team side: Scoreboard, Trend line and People.</p><p><b>National tabs show sample data; they need your company’s national report.</b> Loading a CSV replaces only the team side: Scoreboard, Trend line and People.</p><p><b>Expected columns</b> (first row = header):</p><code></code><p>'+cfg.help+'</p>';
    panel.querySelector('code').textContent=cfg.columns.join(',');
    var file=el('input',{type:'file',accept:'.csv,text/csv,text/plain'});
    var ta=el('textarea',{placeholder:'Or paste CSV text here',spellcheck:'false'});
    var err=el('div',{'class':'egd-err'});
    var row=el('div',{'class':'egd-row'});
    var go=el('button',{'class':'egd-btn pri',type:'button'},'Load data');
    var tpl=el('a',{'class':'egd-btn',href:'#',download:cfg.filename},'Download CSV template');
    var rst=el('button',{'class':'egd-btn',type:'button'},'Reset to sample');
    var cl=el('button',{'class':'egd-btn',type:'button'},'Close');
    [go,tpl,rst,cl].forEach(function(b){row.appendChild(b);});
    [file,ta,err,row].forEach(function(n){panel.appendChild(n);});
    ov.appendChild(panel);
    try{tpl.href=URL.createObjectURL(new Blob([cfg.sample],{type:'text/csv'}));}catch(e){tpl.href='data:text/csv;charset=utf-8,'+encodeURIComponent(cfg.sample);}
    function reset(){try{localStorage.removeItem(KEY);}catch(e){}try{if(window.EvergreenSetup&&cfg.setup)EvergreenSetup.reset(cfg.setup);}catch(e){}location.reload();}
    open.onclick=function(){err.textContent='';ov.hidden=false;};
    cl.onclick=function(){ov.hidden=true;};
    ov.addEventListener('click',function(e){if(e.target===ov)ov.hidden=true;});
    rst.onclick=reset;
    function apply(){
      var text=ta.value;err.textContent='';
      try{load(text,false);}catch(e){err.textContent='Could not read that data: '+e.message;return;}
      try{localStorage.setItem(KEY,text);}catch(e){err.textContent='Your browser blocked local storage, so the data cannot be saved.';return;}
      location.reload();
    }
    go.onclick=apply;
    file.onchange=function(){var f=file.files&&file.files[0];if(!f)return;var r=new FileReader();r.onload=function(){ta.value=String(r.result);apply();};r.readAsText(f);};
    if(!isSample){var b2=el('button',{'class':'egd-btn',type:'button'},'Reset to sample');b2.onclick=reset;banner.appendChild(b2);}
    document.body.insertBefore(banner,document.body.firstChild);
    document.body.appendChild(ov);
  }
  return {init:function(c){
    cfg=c;KEY=c.key;var saved=null,D=null,isSample=true;
    try{saved=localStorage.getItem(KEY);}catch(e){}
    if(saved){try{D=load(saved,false);isSample=false;}catch(e){D=null;}}
    if(!D)D=load(c.sample,true);
    mount(isSample);
    return D;
  }};
})();
</script>
<script src="../../shared/setup-interview.js"></script>
<script>
const SETUP_ID='business-gifts';
const ANS=(function(){try{return (window.EvergreenSetup&&EvergreenSetup.answers(SETUP_ID))||{};}catch(e){return {};}})();
const ANS_USED=JSON.stringify(ANS);
const has=v=>v!==''&&v!=null&&isFinite(Number(v));
const nk=s=>{const p=String(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').trim().split(/\s+/).filter(Boolean);return p.length?p[0]+(p[1]?' '+p[1][0]:''):'';};
const REP=['CSP','Rep','Manager'].indexOf(ANS.repWord)>=0?ANS.repWord:'CSP', REPS=REP+'s';
const RLOW=REP==='CSP'?REPS:REPS.toLowerCase();

    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--${col})" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <line x1="${size/2}" y1="${size/2 - r - 8}" x2="${size/2}" y2="${size/2 - r + 8}" stroke="var(--pace)" stroke-width="2.5" transform="rotate(${m.FR*360} ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" class="ringtxt" style="font-size:${size>120?24:15}px">${Math.round(p*100)}%</text></svg>`;
}
function vPeople(m){

  const cards = [...m.people].sort((a,b)=>b.ytd-a.ytd).map(p=>{ const st = status(m, p.ytd, p.target); return `<div class="card pc">
    <div class="top">${ring(m, p.ytd/p.target, 74, st.c)}<div><div class="nm">${esc(p.name)}</div><span class="pill ${st.c}">${st.t}</span></div></div>
    <div class="line"><span class="muted">So far</span><span class="b">${money(p.ytd)}</span></div>

    <div class="need">${p.ytd >= p.target ? `<b class="up">${goalsOn ? 'Goal reached.' : `Already past ${Y-1}.`}</b> Everything now is extra.` : `To reach ${tgtWord()}: <b>${money((p.target-p.ytd)/monthsLeft)}</b> a month from now on.`}</div>

      <div class="sub"><span class="${s.c} b">${gapTxt(m, m.ytd, m.divTarget)}</span> of pace · on track to finish at <b>${money(m.fore)}</b> · ${vsLyHtml(m)}</div>
      <div class="sub" style="margin-top:6px">The small dark mark on each circle is where the person should be today.</div></div></div>

function plan(){
  const el = $('#plan');
  if (!G || !G.rows) { el.hidden = true; return; }
  const L = [['BIZ','Business gifts','--l1'],['RLT','Realtor gifts','--l2'],['EVT','Events','--l3'],['SVC','Service calls / other','--l4']];
  const sum = (key, f) => G.rows.reduce((a,r)=>a+((r[key]||{})[f]||0),0);
  const proj = L.map(([key]) => sum(key,'proj')), goal = L.map(([key]) => G.rows.reduce((a,r)=>{ const x = r[key]||{}; return a + (x.goal || x.proj || 0); },0));
  const totP = proj.reduce((a,b)=>a+b,0), totG = goal.reduce((a,b)=>a+b,0);
  const filled = G.rows.filter(r => L.some(([key]) => (r[key]||{}).proj || (r[key]||{}).goal)).length;
  el.hidden = false;
  el.innerHTML = `<h2>${G.year} plan</h2>
    <div class="h2n">From the goals you entered. ${filled} of ${G.rows.length} ${RLOW} have a number in.</div>
    ${totP ? `<div class="kpi"><div class="l">Division projection</div><div class="v">${money(totP)}</div><div class="n">Goal ${money(totG)}</div></div>
    <div class="bar" role="img" aria-label="Where the projection comes from">${L.map(([,,c],i)=> proj[i] ? `<span style="width:${proj[i]/totP*100}%;background:var(${c})"></span>` : '').join('')}</div>
    <div class="keys">${L.map(([,n,c],i)=>`<div><i style="background:var(${c})"></i>${n}<b>${money(proj[i])}</b>${totP ? Math.round(proj[i]/totP*100) : 0}% of projection</div>`).join('')}</div>`
    : '<div class="muted">No numbers in yet.</div>'}`;
}

/* ---------- National tabs (sample data here; the real page reads a weekly national report) ---------- */
const N = D.national || null;
const pct = (a, b) => b ? (a - b) / b : null;
const pctHtml = p => p == null ? '<span class="muted">new</span>' : `<span class="${p >= 0 ? 'up' : 'down'} b">${p >= 0 ? '+' : ''}${Math.round(p*100)}%</span>`;
const natDate = () => new Date(N.date + 'T12:00:00').toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
const lyBy = (key, f) => Object.fromEntries((N.ly[key] || []).map(x => [f(x), x]));
const sumNum = a => a.reduce((x, z) => x + z, 0);
function natSeries(y){ return (N.series[String(y)] || []).filter(x => x.top25); }
function natNumbers(){
  const L = N.latest, divs = L.divisions, now = natSeries(N.year).slice(-1)[0] || {};
  const lyPt = natSeries(N.year - 1).find(x => x.week === N.week) || null;
  const home = divs.find(d => d.name === N.home);
  const homeNow = (N.home_cum[String(N.year)] || []).slice(-1)[0] || 0;
  return {L, divs, now, lyPt, home, homeNow, cut: divs.length ? divs[divs.length-1].cpo : null};
}
function natHeader(){
  const n = natNumbers();
  $('#title').textContent = `National gifting ${N.year}`;
  $('#asof').textContent = `Sample national report, week ${N.week} (${natDate()}) · made-up numbers`;
  $('#note').hidden = false;
  $('#note').innerHTML = `<b>Sample data.</b> National tabs show made-up numbers; they need your company's national report. Such a report lists the top 25 divisions, sellers, events and items, so "nationwide" here means the top 25 divisions combined. Divisions and events count business gifts only.`;
  const g = n.lyPt ? pct(n.now.top25, n.lyPt.top25) : null;
  $('#kpis').innerHTML = `
    <div class="card kpi"><div class="l">Top 25 divisions, business gifts</div><div class="v">${k(n.now.top25)}</div><div class="n">${g == null ? 'No report for last year' : `${pctHtml(g)} vs same week ${N.year-1}`}</div></div>
    <div class="card kpi"><div class="l">${esc(N.home)}'s place</div><div class="v ${n.home ? '' : 'down'}">${n.home ? '#' + n.home.rank : 'Outside 25'}</div><div class="n">${n.home ? `of the top 25 · ${money(n.home.cpo)}` : `${money(n.homeNow)} so far`}</div></div>
    ${(() => { const up = n.home && n.home.rank > 1 ? n.divs[n.home.rank - 2] : null;
      return up ? `<div class="card kpi"><div class="l">Gap to #${up.rank}</div><div class="v">${k(up.cpo - n.home.cpo)}</div><div class="n">${esc(up.name)} is at ${money(up.cpo)}</div></div>`
        : `<div class="card kpi"><div class="l">Line to make the top 25</div><div class="v">${money(n.cut)}</div><div class="n">${esc(N.home)} is ${k(Math.abs(n.homeNow - n.cut))} ${n.homeNow >= n.cut ? 'above' : 'below'} it</div></div>`; })()}
    <div class="card kpi"><div class="l">#1 division</div><div class="v">${n.divs[0] ? esc(n.divs[0].name) : '—'}</div><div class="n">${n.divs[0] ? `${money(n.divs[0].cpo)} · ${n.divs[0].reps} sellers` : ''}</div></div>`;
}
function vNRanks(){
  const n = natNumbers(), T = TT === 'BIZ', word = T ? 'business gifts' : 'realtor gifts';
  const lyDiv = lyBy('divisions', d => d.name), mx = n.divs.length ? n.divs[0].cpo : 1;
  const homeLyNow = (N.home_cum[String(N.year-1)] || [])[N.week-1] || 0;
  const drow = (d, cls) => { const was = lyDiv[d.name], isHome = d.name === N.home;
    const ch = isHome && homeLyNow ? pctHtml(pct(isHome && !d.rank ? n.homeNow : d.cpo, homeLyNow)) : was ? pctHtml(pct(d.cpo, was.cpo)) : '<span class="muted">new</span>';
    return `<div class="drow ${cls}"><div class="rank">${d.rank || ''}</div><div class="rname">${esc(d.name)}<small>${d.reps} sellers · ${d.orders} orders</small></div>
      <div class="track"><div class="fill" style="width:${Math.max(1, d.cpo/mx*100)}%;background:var(${cls.includes('home') ? '--copper' : '--l3'})"></div></div>
      <div class="rnum b">${money(d.cpo)}</div><div class="rnum">${ch}</div></div>`; };
  let divHtml = n.divs.map(d => drow(d, d.name === N.home ? 'home' : '')).join('');
  if (!n.home) divHtml += drow({name:N.home, cpo:n.homeNow, reps:'—', orders:'—'}, 'home gap');
  const reps = n.L[T ? 'reps_biz' : 'reps_rlt'] || [], lyRep = lyBy(T ? 'reps_biz' : 'reps_rlt', r => r.name);
  const mine = (D.types[TT].reps.find(r => r.name === N.home_rep) || {}).ytd || 0;
  const inList = reps.find(r => r.name === N.home_rep), repCut = reps.length ? reps[reps.length-1].cpo : 0;
  const repRows = reps.map(r => `<tr class="${r.name === N.home_rep ? 'home' : ''}"><td>${r.rank}</td><td class="name l">${esc(r.name)}</td><td>${r.orders}</td><td>${money(r.cpo)}</td><td>${r.orders ? money(r.cpo/r.orders) : '—'}</td><td>${lyRep[r.name] ? '#' + lyRep[r.name].rank : '<span class="muted">—</span>'}</td></tr>`).join('');
  const ev = (n.L.events || []).map(e => `<tr><td>${e.rank}</td><td class="txt">${esc(e.name)}</td><td>${e.orders}</td><td>${money(e.cpo)}</td></tr>`).join('');
  const big = (n.L[T ? 'orders_biz' : 'orders_rlt'] || []).slice(0, 15).map(o => `<tr><td>${o.rank}</td><td class="name l">${esc(o.name)}</td><td>Week ${+o.week.slice(4)}</td><td>${money(o.cpo)}</td></tr>`).join('');
  $('#v-nranks').innerHTML = `
    <div class="card"><h2>Divisions, business gifts so far this year</h2><div class="h2n">Top 25 in the country. Last column: change vs the same week last year.</div>${divHtml}
      ${(() => { const w = lyDiv[N.home]; return w && w.div !== (n.home || {}).div ? `<div class="callout">${esc(N.home)}'s change is our own office against itself last year. The national report compares against last year's ${esc(N.home)} division (number ${esc(w.div)}, ${w.reps} sellers, ${money(w.cpo)} by this week), which was set up differently.</div>` : ''; })()}</div>
    <div class="card"><h2>Top sellers nationally · ${word}</h2><div class="h2n">So far this year. "Place last year" is where they stood at this point in ${N.year-1}.</div>
        <div class="tablewrap"><table><thead><tr><th>#</th><th class="l">Seller</th><th>Orders</th><th>Sales</th><th>Avg order</th><th>Place last year</th></tr></thead><tbody>${repRows || '<tr><td colspan="6" class="muted">Not in this week’s report.</td></tr>'}</tbody></table></div>
        ${reps.length ? `<div class="callout"><b>${esc(N.home_rep)}</b>: ${inList ? `#${inList.rank} in the country.` : `${money(mine)} so far. The #25 spot is at ${money(repCut)}, so ${k(Math.max(0, repCut - mine))} more puts them on this list.`}</div>` : ''}</div>
    <div class="grid2">
        <div class="card"><h2>Top events for business gifts</h2><div class="h2n">Shows and fairs, all divisions.</div>
          <div class="tablewrap"><table><thead><tr><th>#</th><th class="l">Event</th><th>Orders</th><th>Sales</th></tr></thead><tbody>${ev}</tbody></table></div></div>
      <div class="card"><h2>Biggest single orders · ${word}</h2><div class="h2n">One order each, this year.</div>
        <div class="tablewrap"><table><thead><tr><th>#</th><th class="l">Seller</th><th>When</th><th>Order</th></tr></thead><tbody>${big || '<tr><td colspan="4" class="muted">Not in this week\u2019s report.</td></tr>'}</tbody></table></div></div>
    </div>`;
}
function vNTrends(){
  const n = natNumbers(), T = TT === 'BIZ', word = T ? 'business gift' : 'realtor';
  const s1 = natSeries(N.year), s0 = natSeries(N.year - 1), W = Array.from({length:53}, (_, i) => i + 1);
  const at = (s, f) => W.map(w => { const p = s.find(x => x.week === w); return p ? f(p) : null; });
  const homeNow = N.home_cum[String(N.year)] || [], homeLy = N.home_cum[String(N.year-1)] || [];
  const lyItem = lyBy(T ? 'items_biz' : 'items_rlt', x => x.item);
  const items = (n.L[T ? 'items_biz' : 'items_rlt'] || []).map(x => { const w = lyItem[x.item];
    return `<tr><td>${x.rank}</td><td class="txt">${esc(x.name)} <span class="muted">${esc(x.item)}</span></td><td>${x.qty.toLocaleString('en-US')}</td><td>${w ? w.qty.toLocaleString('en-US') : '—'}</td><td>${w ? pctHtml(pct(x.qty, w.qty)) : '<span class="pill up">New on list</span>'}</td></tr>`; }).join('');
  const lyDiv = lyBy('divisions', d => d.name);
  const movers = n.divs.filter(d => lyDiv[d.name]).map(d => ({d, p: pct(d.cpo, lyDiv[d.name].cpo)})).sort((a, b) => b.p - a.p);
  const mv = list => list.map(({d, p}) => `<tr class="${d.name === N.home ? 'home' : ''}"><td class="name">${esc(d.name)}</td><td>${money(d.cpo)}</td><td>${pctHtml(p)}</td></tr>`).join('');
  $('#v-ntrends').innerHTML = `
    <div class="grid2">
      <div class="card"><h2>Business gifting nationwide</h2><div class="h2n">Top 25 divisions combined, running total by week. ${N.year-1}'s line starts in June because earlier reports can't be read.</div><div class="chart"><canvas id="n1"></canvas></div></div>
      <div class="card"><h2>${esc(N.home)} vs the top-25 line</h2><div class="h2n">Our business gifts by week against what the #25 division had that week.</div><div class="chart"><canvas id="n2"></canvas></div></div>
    </div>
    <div class="card"><h2>What's selling · ${word} orders</h2><div class="h2n">Top 25 items in the country by quantity, so far this year, against the same week of ${N.year-1}.</div>
      <div class="tablewrap"><table><thead><tr><th>#</th><th class="l">Item</th><th>${N.year}</th><th>${N.year-1}</th><th>Change</th></tr></thead><tbody>${items}</tbody></table></div></div>
    <div class="grid2">
      <div class="card"><h2>Growing fastest</h2><div class="h2n">Divisions in both years' top 25, change vs same week ${N.year-1}.</div><div class="tablewrap"><table><thead><tr><th>Division</th><th>So far</th><th>Change</th></tr></thead><tbody>${mv(movers.slice(0, 8))}</tbody></table></div></div>
      <div class="card"><h2>Shrinking most</h2><div class="h2n">Same divisions, the other end.</div><div class="tablewrap"><table><thead><tr><th>Division</th><th>So far</th><th>Change</th></tr></thead><tbody>${mv(movers.slice(-8).reverse())}</tbody></table></div></div>
    </div>`;
  const opts = {maintainAspectRatio:false, spanGaps:true, interaction:{mode:'index', intersect:false},
    plugins:{legend:{position:'bottom', labels:{color:css('--muted'), boxWidth:14, font:{family:'Manrope', weight:'600'}}},
      tooltip:{callbacks:{title:c => 'Week ' + c[0].label, label:c => `${c.dataset.label}: ${money(c.parsed.y)}`}}},
    scales:{x:{grid:{display:false}, ticks:{color:css('--muted'), maxTicksLimit:9}}, y:{beginAtZero:true, grid:{color:css('--grid')}, ticks:{color:css('--muted'), callback:v => k(v)}}}};
  const line = (label, data, color, dash, wdt) => ({label, data, borderColor:css(color), backgroundColor:css(color), borderDash:dash || [], borderWidth:wdt || 2, pointRadius:0, tension:.25});
  ['n1','n2'].forEach(id => { if (charts[id]) charts[id].destroy(); });
  charts.n1 = new Chart($('#n1'), {type:'line', data:{labels:W, datasets:[
    line(`${N.year}`, at(s1, p => p.top25), '--copper', null, 3), line(`${N.year-1}`, at(s0, p => p.top25), '--ly')]}, options:opts});
  charts.n2 = new Chart($('#n2'), {type:'line', data:{labels:W, datasets:[
    line(`${N.home} ${N.year}`, W.map((w, i) => i < homeNow.length ? homeNow[i] : null), '--copper', null, 3),
    line('#25 division', at(s1, p => p.cut), '--pace', [6,5]),
    line(`${N.home} ${N.year-1}`, W.map((w, i) => homeLy[i] ?? null), '--ly')]}, options:opts});
}

function render(){
  const nat = VIEW === 'nranks' || VIEW === 'ntrends';
  const m = model(TT);
  if (nat) natHeader(); else header(m);
  ({score:vScore, trend:vTrend, people:vPeople, nranks:vNRanks, ntrends:vNTrends})[VIEW](m);
  ['score','trend','people','nranks','ntrends'].forEach(v => $('#v-'+v).hidden = v !== VIEW);

  const past = D.years.filter(y => y < Y);
  $('#foot').innerHTML = nat
    ? `Sample data. Every name, division, event, item and number on the national tabs is made up for illustration, and loading your own CSV does not change them: they need your company's national report.`

}
if (!N) document.querySelectorAll('#tabs .nat').forEach(b => b.hidden = true);
document.querySelectorAll('#types button').forEach(b => b.onclick = () => { TT = b.dataset.t;
  document.querySelectorAll('#types button').forEach(x => x.classList.toggle('on', x === b)); render(); });
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { VIEW = b.dataset.v;

if (ANS.team) $('#eyebrow').textContent = ANS.team;
document.querySelector('#tabs [data-v=people]').textContent = REPS;
if (/^no/i.test(ANS.realtor || '') || !D.types.RLT.reps.length) $('#types').style.display = 'none';
plan();
render();
if (window.EvergreenSetup) EvergreenSetup.init({
  id: SETUP_ID,
  title: 'Set up your business-gifts page',
  intro: 'A few quick questions so the labels, goals and people on this page match your team. About 3 minutes. Everything is optional.',
  questions: [
    {key:'team', q:'What should this page call your team?', why:'Shown at the top of the page so people know whose numbers these are. You can add your office number from your order system.', type:'text', optional:true, example:'Evergreen Division · Office #1234', placeholder:'e.g. Evergreen Division · Office #1234'},
    {key:'repWord', q:'What do you call the people listed on this page?', why:'A CSP (Cutco Sales Professional) is a senior rep. Pick the word your team uses; it replaces the labels and column heading.', type:'choice', options:['CSP','Rep','Manager'], example:'CSP'},
    {key:'realtor', q:'Do you want to see realtor gifts too?', why:'Orders are tagged BIZ (business gift) or RLT (realtor gift) by whoever enters them, and only tagged orders show up here. If you do not sell to realtors, hide that view.', type:'choice', options:['Yes, show both','No, business gifts only'], example:'Yes, show both'},
    {key:'goalYear', q:'Which year are your goals for?', why:'Sets which year the goals below belong to. If it is next year, the page keeps measuring people against their own total from last year until January 1, and shows a plan card. If it is this year, people are measured against their goals now. Leave it blank to use next year.', type:'number', optional:true, example:'2027', placeholder:'e.g. 2027'},
    {key:'reps', q:'Who are your CSPs, and what is each person\u2019s goal for the year?', why:'Goals are whole-year dollars. Use the name as it appears in your data (first name and last initial is enough). Leave a goal blank if someone has none. Matching names get the goal, and anyone missing from your data shows at $0 so far.', type:'list', optional:true, fields:[{key:'name',label:'Name'},{key:'biz',label:'Business-gift goal ($)',type:'number'},{key:'rlt',label:'Realtor-gift goal ($)',type:'number'}], example:'Jordan K. \u00b7 $60,000 business \u00b7 $25,000 realtor'},
    {key:'growth', q:'If someone has no goal, how much growth over last year should we assume?', why:'In percent. Used by the scoreboard designs page; this page does not use it.', type:'number', optional:true, example:'10', placeholder:'e.g. 10'},
    {key:'pace', q:'How should the page decide where each person should be today?', why:'Gift sales are lumpy, for example heavy near year end. Seasonal pace uses how much of the year was usually done by this date in earlier years, so it needs at least one earlier year of data. Straight line works for a brand new team.', type:'choice', options:['Seasonal: follow earlier years','Straight line: same each month'], example:'Seasonal: follow earlier years'},
    {key:'behind', q:'Below what percent of pace is someone \u201cbehind\u201d?', why:'At or above 100% of where they should be today is \u201cahead\u201d. Between this number and 100% is \u201cclose\u201d. Under this number shows red as \u201cbehind\u201d.', type:'number', optional:true, example:'90', placeholder:'e.g. 90'}
  ],
  onDone(a){ if (JSON.stringify(a || {}) !== ANS_USED) location.reload(); }
});
